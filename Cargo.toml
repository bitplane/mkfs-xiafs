[package]
name = "mkfs-xiafs"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "WTFPL"
authors = ["Gareth Davidson <gaz@bitplane.net>"]
repository = "https://github.com/bitplane/mkfs-xiafs"
homepage = "https://bitplane.net/dev/rust/mkfs-xiafs"
description = "Create xiafs filesystem images"
readme = "README.md"
keywords = ["xiafs", "filesystem", "mkfs", "linux"]
categories = ["command-line-utilities", "filesystem"]

[[bin]]
name = "mkfs-xiafs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
